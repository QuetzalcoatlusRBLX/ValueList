<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgotten TTD Value List</title>
<!-- ===== EMBED PREVIEW (DISCORD SOCIAL MEDIA) ===== -->

<meta property="og:title" content="Forgotten TTD Value List">
<meta property="og:description" content="Check out all unit values, partners, admins, and updates in Forgotten TTD Value List!">
<meta property="og:image" content="https://cdn.discordapp.com/attachments/1136904354100690944/1508117538549272607/ChatGPT_Image_May_19_2026_07_34_38_PM.png?ex=6a145f68&is=6a130de8&hm=3c6c0939b4b60e253fec5fa9601a0c2fe7e07540c0cca4169a6d091fb06c7d09&">
<meta property="og:url" content="https://quetzalcoatlusrblx.github.io/ValueList/">
<meta property="og:type" content="website">

  <title>TTD Trade Calculator</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen p-6">

<div class="max-w-7xl mx-auto">

  <h1 class="text-5xl font-black text-center text-cyan-400 mb-2">
    TTD VALUE LIST
  </h1>

  <p class="text-center text-slate-400 mb-8">
    Add units to compare trades
  </p>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- VALUE LIST -->
    <div class="bg-slate-900 rounded-3xl p-5 border border-slate-700">

      <div class="flex justify-between items-center mb-4">

        <h2 class="text-2xl font-bold text-yellow-400">
          Value List
        </h2>

        <input
          id="searchValue"
          type="text"
          placeholder="Search..."
          class="bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 outline-none"
        >

      </div>

      <div
        id="valueList"
        class="space-y-3 max-h-[700px] overflow-y-auto"
      ></div>

    </div>

    <!-- TRADE CALCULATOR -->
    <div class="bg-slate-900 rounded-3xl p-5 border border-slate-700">

      <div class="flex justify-between items-center mb-4">

        <h2 class="text-2xl font-bold">
          Trade Calculator
        </h2>

        <button
          onclick="clearTrades()"
          class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded-xl font-bold transition"
        >
          Clear
        </button>

      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

        <!-- YOUR TRADE -->
        <div class="bg-slate-800 rounded-2xl p-4 border border-cyan-500">

          <div class="flex justify-between items-center mb-4">

            <h3 class="text-xl font-bold text-cyan-300">
              Your Trade
            </h3>

            <button
              onclick="addUnit('mine')"
              class="bg-cyan-500 hover:bg-cyan-600 px-3 py-2 rounded-xl font-bold transition"
            >
              + Add
            </button>

          </div>

          <div
            id="myTrade"
            class="space-y-2 min-h-[300px]"
          ></div>

          <div class="mt-4 text-lg font-bold text-cyan-400">
            Total:
            <span id="myTotal">0</span>
          </div>

        </div>

        <!-- THEIR TRADE -->
        <div class="bg-slate-800 rounded-2xl p-4 border border-pink-500">

          <div class="flex justify-between items-center mb-4">

            <h3 class="text-xl font-bold text-pink-300">
              Their Trade
            </h3>

            <button
              onclick="addUnit('theirs')"
              class="bg-pink-500 hover:bg-pink-600 px-3 py-2 rounded-xl font-bold transition"
            >
              + Add
            </button>

          </div>

          <div
            id="theirTrade"
            class="space-y-2 min-h-[300px]"
          ></div>

          <div class="mt-4 text-lg font-bold text-pink-400">
            Total:
            <span id="theirTotal">0</span>
          </div>

        </div>

      </div>

      <!-- RESULT -->
      <div
        id="result"
        class="mt-6 text-center text-3xl font-black text-yellow-400"
      >
        FAIR TRADE
      </div>

      <div
        id="difference"
        class="text-center text-slate-300 mt-2 text-lg"
      >
        Difference: 0
      </div>

    </div>

  </div>

</div>

<script>

const units = [

  {
    name: "Titan Cameraguy",
    value: 500,
    status: "Unstable"
  },

  {
    name: "TV Girl",
    value: 450,
    status: "Unstable"
  },

  {
    name: "Engineer Cameraman",
    value: 4000,
    status: "Stable"
  },

  {
    name: "Jetpack Cameraguy",
    value: 500,
    status: "Unstable"
  },

  {
    name: "Scientist Cameraman",
    value: 1000,
    status: "Unstable"
  }

];

let myTrade = [];
let theirTrade = [];

const valueList =
  document.getElementById("valueList");

function renderValueList(filter = "") {

  valueList.innerHTML = "";

  units
    .filter(unit =>
      unit.name
        .toLowerCase()
        .includes(filter.toLowerCase())
    )
    .forEach(unit => {

      const div =
        document.createElement("div");

      div.className =
        "bg-slate-800 rounded-2xl p-4 border border-slate-700";

      div.innerHTML = `
        <div class="flex justify-between items-center">

          <div>

            <div class="text-xl font-bold text-cyan-300">
              ${unit.name}
            </div>

            <div class="text-slate-300">
              Value:
              ${unit.value.toLocaleString()}
            </div>

          </div>

          <div class="${
            unit.status === "Stable"
            ? "bg-green-500 text-black"
            : "bg-red-500 text-white"
          } px-3 py-1 rounded-full text-sm font-bold">

            ${unit.status}

          </div>

        </div>
      `;

      valueList.appendChild(div);

    });

}

renderValueList();

document
  .getElementById("searchValue")
  .addEventListener("input", (e) => {
    renderValueList(e.target.value);
  });

function addUnit(side) {

  // MENU
  const menu =
    document.createElement("div");

  menu.className =
    "fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4";

  menu.innerHTML = `
    <div class="bg-slate-900 w-full max-w-md rounded-3xl p-5 border border-slate-700">

      <div class="flex justify-between items-center mb-4">

        <h2 class="text-2xl font-bold text-cyan-400">
          Choose Unit
        </h2>

        <button
          id="closeMenu"
          class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg font-bold"
        >
          X
        </button>

      </div>

      <input
        id="unitSearch"
        type="text"
        placeholder="Search unit..."
        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 outline-none mb-4"
      >

      <div
        id="unitMenuList"
        class="space-y-3 max-h-[500px] overflow-y-auto"
      ></div>

    </div>
  `;

  document.body.appendChild(menu);

  const list =
    menu.querySelector("#unitMenuList");

  const search =
    menu.querySelector("#unitSearch");

  function renderMenu(filter = "") {

    list.innerHTML = "";

    units
      .filter(unit =>
        unit.name
          .toLowerCase()
          .includes(filter.toLowerCase())
      )
      .forEach(unit => {

        const div =
          document.createElement("div");

        div.className =
          "bg-slate-800 hover:bg-slate-700 rounded-2xl p-4 border border-slate-700 cursor-pointer transition";

        div.innerHTML = `
          <div class="flex justify-between items-center">

            <div>

              <div class="font-bold text-cyan-300 text-lg">
                ${unit.name}
              </div>

              <div class="text-slate-300">
                ${unit.value.toLocaleString()} Value
              </div>

            </div>

            <div class="${
              unit.status === "Stable"
              ? "bg-green-500 text-black"
              : "bg-red-500 text-white"
            } px-3 py-1 rounded-full text-sm font-bold">

              ${unit.status}

            </div>

          </div>
        `;

        div.addEventListener("click", () => {

          if (side === "mine") {
            myTrade.push(unit);
          }
          else {
            theirTrade.push(unit);
          }

          renderTrades();

          menu.remove();

        });

        list.appendChild(div);

      });

  }

  renderMenu();

  search.addEventListener("input", (e) => {
    renderMenu(e.target.value);
  });

  menu.querySelector("#closeMenu")
    .addEventListener("click", () => {
      menu.remove();
    });

}

function renderTrades() {

  renderTradeSide(
    "myTrade",
    myTrade,
    "myTotal"
  );

  renderTradeSide(
    "theirTrade",
    theirTrade,
    "theirTotal"
  );

  updateResult();

}

function renderTradeSide(
  containerId,
  list,
  totalId
) {

  const container =
    document.getElementById(containerId);

  container.innerHTML = "";

  list.forEach((item, index) => {

    const div =
      document.createElement("div");

    div.className =
      "bg-slate-700 rounded-xl p-3 flex justify-between items-center";

    div.innerHTML = `
      <div>

        <div class="font-bold">
          ${item.name}
        </div>

        <div class="text-sm text-slate-300">
          ${item.value.toLocaleString()} Value
        </div>

      </div>

      <button
        onclick="removeUnit('${containerId}', ${index})"
        class="bg-red-500 hover:bg-red-600 px-3 py-1 rounded-lg font-bold"
      >
        X
      </button>
    `;

    container.appendChild(div);

  });

  const total =
    list.reduce(
      (sum, item) =>
      sum + item.value,
      0
    );

  document.getElementById(totalId)
    .textContent =
    total.toLocaleString();

}

function removeUnit(side, index) {

  if (side === "myTrade") {
    myTrade.splice(index, 1);
  }
  else {
    theirTrade.splice(index, 1);
  }

  renderTrades();

}

function clearTrades() {

  myTrade = [];
  theirTrade = [];

  renderTrades();

}

function updateResult() {

  const myTotal =
    myTrade.reduce(
      (sum, item) =>
      sum + item.value,
      0
    );

  const theirTotal =
    theirTrade.reduce(
      (sum, item) =>
      sum + item.value,
      0
    );

  const diff =
    Math.abs(
      myTotal - theirTotal
    );

  const result =
    document.getElementById("result");

  const difference =
    document.getElementById("difference");

  difference.textContent =
    "Difference: " +
    diff.toLocaleString();

  if (myTotal > theirTotal) {

    result.textContent =
      "YOU ARE OVERPAYING";

    result.className =
      "mt-6 text-center text-3xl font-black text-red-400";

  }
  else if (myTotal < theirTotal) {

    result.textContent =
      "WIN FOR YOU";

    result.className =
      "mt-6 text-center text-3xl font-black text-green-400";

  }
  else {

    result.textContent =
      "FAIR TRADE";

    result.className =
      "mt-6 text-center text-3xl font-black text-yellow-400";

  }

}

</script>

</body>
</html>
